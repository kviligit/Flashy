# Build the app and publish it to GitHub Pages.
#
# The compiled output (dist/) is deliberately not committed, so Pages needs
# a build step. This runs the same `tsc` the project uses locally, then
# uploads the whole site — index.html, the stylesheet, dist/, and the PWA
# files — as the Pages artifact.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/fsrs-flashcard-webapp-4a8p83]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the compiler
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npx tsc

      - name: Run the unit suite
        run: node --test "dist/**/*.test.js"

      # Without this, Pages runs the upload through Jekyll, which ignores
      # files and directories beginning with an underscore.
      - name: Disable Jekyll
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
