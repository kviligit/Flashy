# Build the app and publish it to GitHub Pages.
#
# The compiled output (dist/) is deliberately not committed, so Pages needs
# a build step. This runs the same `tsc` the project uses locally, then
# uploads the whole site — index.html, the stylesheet, dist/, and the PWA
# files — as the Pages artifact.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/fsrs-flashcard-webapp-4a8p83]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# A push to `main` builds but DOES NOT DEPLOY, and this is not fixable here.
#
# The `github-pages` environment carries a deployment branch policy that, by
# default, permits only the repository's *default branch*. The default branch
# is still `claude/fsrs-flashcard-webapp-4a8p83`, so every deploy job on
# `main` fails after about a second with no steps and no log — which looks
# exactly like an infrastructure hiccup and is not one. Between 2026-09-01 and
# 2026-09-02 that silently left the published site eight commits behind,
# including a stored-XSS fix, while `main` looked green in every other way.
#
# The fix is one repository setting: Settings -> General -> Default branch,
# set it to `main`. Until then, `claude/fsrs-flashcard-webapp-4a8p83` must be
# fast-forwarded to `main` and pushed for anything to actually reach the site,
# and "it built" must not be read as "it shipped".
# ---------------------------------------------------------------------------

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # There is no lockfile, because the environment this project is
      # developed in cannot reach the npm registry to generate one. The
      # compiler version is therefore pinned exactly rather than by range,
      # so a compromised or merely broken patch release cannot be pulled
      # into a build without someone changing this file. Replace this with
      # `npm ci` and a committed package-lock.json as soon as a lockfile
      # can be produced.
      - name: Install the compiler
        run: npm install --no-audit --no-fund --no-save typescript@6.0.2

      - name: Type-check and build
        run: npx tsc

      - name: Run the unit suite
        run: node --test "dist/**/*.test.js"

      # Without this, Pages runs the upload through Jekyll, which ignores
      # files and directories beginning with an underscore.
      - name: Disable Jekyll
        run: touch .nojekyll

      # enablement creates the Pages site on first run, so the repository
      # does not have to be configured by hand beforehand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
