<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e1116" />
    <title>Flashy</title>
    <meta name="description" content="A local-first spaced-repetition flashcard app using FSRS-6." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS ignores SVG for the home screen and needs a real bitmap. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <!-- Safari only runs a saved page full-screen when told to. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" keeps the app below the status bar. "black-translucent"
         looks better but slides content under the notch, which needs
         viewport-fit=cover and matching safe-area padding to be safe; the
         predictable option wins until it can be checked on real hardware. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Flashy" />
    <!-- Reviewing means tapping the same four buttons repeatedly; a
         double-tap must not be read as a request to zoom. -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="./src/ui/theme.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" class="app"></div>
    <script type="module" src="./dist/app/main.js"></script>
  </body>
</html>
