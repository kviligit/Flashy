<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e1116" />
    <title>Flashy</title>
    <!--
      GitHub Pages cannot set response headers, so the policy has to travel
      in the document. Defence in depth behind the sanitiser: if HTML
      injection ever gets through again, an inline handler still will not
      run.

      - script-src 'self': every script is an external module from this
        origin. There are no inline scripts, so no 'unsafe-inline'.
      - style-src needs 'unsafe-inline' for the style attributes the UI
        helpers set; styles are not a script vector here.
      - img-src and media-src allow https: because decks legitimately embed
        remote pictures and audio. That does let a hostile deck learn that a
        card was viewed, which is a privacy leak rather than code execution;
        blob: covers attached files, which are stored locally.
      - connect-src 'self' will need widening to wss: when relay sync lands.

      frame-ancestors is deliberately absent: it is ignored when delivered
      in a meta element, so including it only produces a console warning.
      Clickjacking protection would need a response header, which GitHub
      Pages cannot send.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' blob: data: https:;
               media-src 'self' blob: data: https:;
               font-src 'self';
               connect-src 'self';
               manifest-src 'self';
               worker-src 'self';
               base-uri 'none';
               form-action 'none';
               object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="A local-first spaced-repetition flashcard app using FSRS-6." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS ignores SVG for the home screen and needs a real bitmap. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <!-- Safari only runs a saved page full-screen when told to. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" keeps the app below the status bar. "black-translucent"
         looks better but slides content under the notch, which needs
         viewport-fit=cover and matching safe-area padding to be safe; the
         predictable option wins until it can be checked on real hardware. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Flashy" />
    <!-- Reviewing means tapping the same four buttons repeatedly; a
         double-tap must not be read as a request to zoom. -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="./src/ui/theme.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" class="app"></div>
    <script type="module" src="./dist/app/main.js"></script>
  </body>
</html>
